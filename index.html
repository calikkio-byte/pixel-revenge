let muted=false,ac=null,bgmTimer=0;
function snd(f,d=.1,type='square',v=.045,f2){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

function spr(rows,pal,s=2){
  const w=rows[0].length,h=rows.length,c=mk(w*s,h*s),g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const col=pal[rows[y][x]];
    if(col){g.fillStyle=col;g.fillRect(x*s,y*s,s,s);}
  }
  return c;
}

function pw(l){
  let h=2166136261;const s='ATR-8BIT-'+l;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return 'L'+String(l).padStart(2,'0')+'-'+((h>>>0).toString(36).toUpperCase().padStart(7,'0').slice(0,5));
}

// ---------- SFONDO 2D CHIARO ----------
let bg=null;
function buildBg(l){
  const skyT=['#7ec8f8','#88d4f5','#9ae0f5','#84c5f8','#a4d4ff','#7fd8e8','#95c8f8','#8ad2f0','#9dc4f8','#82cef8'][(l-1)%10];
  const skyB='#e6f6ff';
  const sky=mk(W,H),g=sky.getContext('2d');
  const steps=10;
  for(let i=0;i<steps;i++){
    g.fillStyle=i<steps/2?skyT:skyB;
    g.fillRect(0,Math.floor(i*GY/steps),W,Math.ceil(GY/steps)+1);
  }
  g.fillStyle='#bfe6ff';
  g.fillRect(0,Math.floor(GY*0.42),W,Math.ceil(GY*0.3));
  g.fillStyle=skyB;
  g.fillRect(0,Math.floor(GY*0.72),W,Math.ceil(GY*0.28));

  g.fillStyle='#ffffff';
  const cloudYStart=Math.max(58,Math.floor(GY*0.32));
  for(let i=0;i<5;i++){
    const cx=(i*83+25)%Math.max(40,W-40),cy=cloudYStart+(i*19)%Math.max(24,Math.floor(GY*0.32));
    g.fillRect(cx+4,cy,18,4);
    g.fillRect(cx,cy+4,26,6);
  }

  const far=mk(W,H),f=far.getContext('2d');
  let x=0;
  while(x<W){
    const w=22+Math.floor(rnd(0,3))*8,hg=26+Math.floor(rnd(0,42));
    f.fillStyle='#cbe2f6';f.fillRect(x,GY-hg,w,hg);
    f.fillStyle='#9fc3e4';f.fillRect(x,GY-hg,w,2);
    f.fillStyle='#ffffff';
    for(let yy=GY-hg+5;yy<GY-6;yy+=7)
      for(let xx=x+4;xx<x+w-4;xx+=6)f.fillRect(xx,yy,3,4);
    f.fillStyle='#34b250';f.fillRect(x+2,GY-8,6,5);
    f.fillStyle='#7c4d25';f.fillRect(x+4,GY-3,2,3);
    x+=w+2;
  }

  const tileH=Math.max(40,H-GY);
  const tile=mk(24,tileH),t=tile.getContext('2d');
  t.fillStyle='#38c158';t.fillRect(0,0,24,4);
  t.fillStyle='#269641';t.fillRect(0,4,24,2);
  t.fillStyle='#e8dcc4';t.fillRect(0,6,24,tileH-6);
  t.fillStyle='#cbbba0';
  for(let ty=14;ty<tileH;ty+=10){
    t.fillRect(0,ty,24,2);
    const off=(Math.floor(ty/10)%2)*12;
    t.fillRect(off+6,ty-8,2,8);
  }
  return {sky,far,tile};
}

  mode='temple';
  tr={
    time:1260,maxTime:1260, // 21 secondi totali
    lane:1,laneX:0,
    jumpT:0,jumpMax:38, // Salto ampio e comodo
    duckT:0,duckMax:38, // Scivolata ampia e comoda
    zSpeed:0.0085,scrollZ:0, // Partenza super dolce!
    curve:0,targetCurve:0,
    spawnT:45,pts:0,
    introT:130, // ~2.2 secondi di pista libera con istruzioni chiare per prendere confidenza
    objs:[
      // Prime monete guida al centro per far capire subito la prospettiva
      {t:'coin',lane:1,z:0.55},
      {t:'coin',lane:1,z:0.75},
      {t:'coin',lane:1,z:0.95}
    ]
  };
  bgmTimer=0;
  arp([523,659,784,1047,1318,1568],.1,60);
}

function endTempleBonus(crashed){
  mode='play';
  obs=[];
  hurt=100;
  p.y=GY-24;p.vy=0;p.j=0;
  if(crashed){
    shake=12;
    snd(140,.3,'sawtooth',.08,60);
    msg='FINE BONUS 3D! +'+tr.pts+' PT';
    msgT=110;
  }else{
    bonus+=3000;
    tr.pts+=3000;
    arp([523,659,784,1047,1318,1568],.13,75);
    msg='JACKPOT BONUS 3D! +'+tr.pts+' PT!';
    msgT=130;
  }
}

function templeAction(act){
  if(mode!=='temple')return;
  // Finestra di svolta molto più generosa (da z=0.60 fino a z=-0.06)
  const turnObj=tr.objs.find(o=>o.t==='turn'&&!o.done&&o.z<0.60&&o.z>-0.06);
  if(act==='left'){
    if(turnObj){
      if(turnObj.dir===-1){
        turnObj.done=true;
        bonus+=500;tr.pts+=500;
        tr.targetCurve=-26;
        setTimeout(()=>{tr.targetCurve=0;},500);
        pops.push({x:W/2,y:H*0.36,t:'SVOLTA SX OK! +500',c:'#0a7d42',l:38});
        arp([587,880,1174],.08,55);
        return;
      }else if(turnObj.z<0.25){
        endTempleBonus(true);return;
      }
    }
    if(tr.lane>0){tr.lane--;snd(420,.06,'square',.04,560);}
  }else if(act==='right'){
    if(turnObj){
      if(turnObj.dir===1){
        turnObj.done=true;
        bonus+=500;tr.pts+=500;
        tr.targetCurve=26;
        setTimeout(()=>{tr.targetCurve=0;},500);
        pops.push({x:W/2,y:H*0.36,t:'SVOLTA DX OK! +500',c:'#0a7d42',l:38});
        arp([587,880,1174],.08,55);
        return;
      }else if(turnObj.z<0.25){
        endTempleBonus(true);return;
      }
    }
    if(tr.lane<2){tr.lane++;snd(420,.06,'square',.04,560);}
  }else if(act==='center'){
    tr.lane=1;snd(460,.06,'square',.04,600);
  }else if(act==='up'){
    if(tr.jumpT<=0){
      tr.jumpT=tr.jumpMax;tr.duckT=0;
      snd(380,.12,'square',.05,760);
    }
  }else if(act==='down'){
    if(tr.duckT<=0){
      tr.duckT=tr.duckMax;tr.jumpT=0;
      snd(260,.12,'triangle',.05,150);
    }
  }
}

function spawnTempleRow(prog){
  const r=Math.random();
  // Nei primi secondi niente curve improvvise, così prendi confidenza con corsie e salti
  if(prog>0.20&&r<0.20){
    const dir=Math.random()<0.5?-1:1;
    tr.objs.push({t:'turn',dir,z:1.0,done:false});
    return;
  }

  // All'inizio (prog < 0.35) genera 1 solo ostacolo alla volta con 2 corsie libere!
  if(prog<0.35){
    const obsLane=Math.floor(rnd(0,3));
    const coinLane=(obsLane+1)%3;
    const kind=Math.random()<0.45?'low':(Math.random()<0.75?'wall':'high');
    tr.objs.push({t:kind,lane:obsLane,z:1.0});
    tr.objs.push({t:'coin',lane:coinLane,z:1.0});
    return;
  }

  // Poi aumenta gradualmente la varietà
  const pattern=Math.floor(rnd(0,4));
  const freeLane=Math.floor(rnd(0,3));
  if(pattern===0){
    for(let l=0;l<3;l++){
      if(l!==freeLane)tr.objs.push({t:'low',lane:l,z:1.0});
      else tr.objs.push({t:'coin',lane:l,z:1.0});
    }
  }else if(pattern===1){
    for(let l=0;l<3;l++){
      if(l!==freeLane)tr.objs.push({t:'high',lane:l,z:1.0});
      else tr.objs.push({t:'coin',lane:l,z:1.0});
    }
  }else if(pattern===2){
    for(let l=0;l<3;l++){
      if(l!==freeLane)tr.objs.push({t:'wall',lane:l,z:1.0});
      else tr.objs.push({t:'coin',lane:l,z:1.0});
    }
  }else{
    const lanes=[0,1,2].sort(()=>Math.random()-0.5);
    tr.objs.push({t:'wall',lane:lanes[0],z:1.0});
    tr.objs.push({t:'low',lane:lanes[1],z:1.0});
    tr.objs.push({t:'coin',lane:lanes[2],z:1.0});
  }
}

function updateTemple(dt){
  tr.time-=dt;
  if(tr.introT>0)tr.introT-=dt;
  if(tr.time<=0){
    endTempleBonus(false);
    return;
  }

  bgmTimer-=dt;
  if(bgmTimer<=0){
    bgmTimer=6.5;
    snd(TEMPLE_MELODY[melIdx%TEMPLE_MELODY.length],0.08,'square',0.04);
    melIdx++;
  }

  // Progressione morbida: parte lentissimo (0.0085) e accelera gradualmente fino a 0.0175
  const prog=1-(tr.time/tr.maxTime);
  const speedCurve=Math.pow(prog,1.3);
  tr.zSpeed=(0.0085+speedCurve*0.0090)*dt;
  tr.scrollZ=(tr.scrollZ+tr.zSpeed*10)%1;

  const targetX=tr.lane-1;
  tr.laneX+=(targetX-tr.laneX)*Math.min(1,0.26*dt);
  tr.curve+=(tr.targetCurve-tr.curve)*Math.min(1,0.12*dt);

  if(tr.jumpT>0)tr.jumpT=Math.max(0,tr.jumpT-dt);
  if(tr.duckT>0)tr.duckT=Math.max(0,tr.duckT-dt);

  if(tr.introT<=0){
    tr.spawnT-=dt;
    if(tr.spawnT<=0){
      spawnTempleRow(prog);
      // Molto spazio tra una fila e l'altra all'inizio (58 frame), poi scende fino a 32 frame
      tr.spawnT=Math.max(32,58-prog*26);
    }
  }

  for(const o of tr.objs){
    o.z-=tr.zSpeed;
    if(!o.passed&&o.z<=0.055&&o.z>=-0.025){
      if(o.t==='turn'){
        if(o.z<=0.0&&!o.done){
          endTempleBonus(true);return;
        }
      }else if(o.lane===tr.lane){
        if(o.t==='coin'){
          o.passed=true;
          bits++;bonus+=100;tr.pts+=100;
          pops.push({x:W/2+(o.lane-1)*45,y:H*0.62,t:'+100',c:'#d97706',l:26});
          snd(987,.07,'square',.045,1318);
        }else if(o.t==='low'){
          if(tr.jumpT>2){
            o.passed=true;bonus+=150;tr.pts+=150;
            pops.push({x:W/2,y:H*0.55,t:'SALTO OK! +150',c:'#0a7d42',l:22});
          }else{
            endTempleBonus(true);return;
          }
        }else if(o.t==='high'){
          if(tr.duckT>2){
            o.passed=true;bonus+=150;tr.pts+=150;
            pops.push({x:W/2,y:H*0.55,t:'SCIVOLATA! +150',c:'#0b65c6',l:22});
          }else{
            endTempleBonus(true);return;
          }
        }else if(o.t==='wall'){
          endTempleBonus(true);return;
        }
      }
    }
  }
  tr.objs=tr.objs.filter(o=>!(o.t==='coin'&&o.passed)&&o.z>-0.12);

  for(const q of pops){q.y-=0.55*dt;q.l-=dt;}
  pops=pops.filter(q=>q.l>0);
}

// ---------- DISEGNO BONUS 3D CON COLORI CHIARI E ALTA LEGGIBILITÀ ----------
function drawTemple(){
  fN++;
  const hzY=Math.round(H*0.27);
  const botY=isPortrait?Math.round(H*0.82):Math.round(H*0.84);
  const playerY=botY-18;

  // Cielo luminoso Cupertino + Fascia Arcobaleno Apple all'orizzonte
  ctx.fillStyle='#a8dfff';
  ctx.fillRect(0,0,W,hzY);
  ctx.fillStyle='#dff4ff';
  ctx.fillRect(0,Math.floor(hzY*0.55),W,Math.ceil(hzY*0.45));

  const rbCols=['#61bb46','#fdb827','#f5821f','#e03a3e','#963d97','#009ddc'];
  for(let i=0;i<6;i++){
    ctx.fillStyle=rbCols[i];
    ctx.fillRect(0,hzY-12+i*2,W,2);
  }

  // Prato verde luminoso ai lati della pista
  ctx.fillStyle='#5fd068';
  ctx.fillRect(0,hzY,W,H-hzY);

  // Strada 3D chiara e super leggibile con corsie ben distinte
  const topW=44,botW=Math.min(W*0.92,260);
  const slices=26;
  for(let i=0;i<slices;i++){
    const z1=1-(i/slices),z2=1-((i+1)/slices);
    const p1=Math.pow(1-z1,1.45),p2=Math.pow(1-z2,1.45);
    const y1=hzY+p1*(botY-hzY),y2=hzY+p2*(botY-hzY);
    const w1=topW+p1*(botW-topW),w2=topW+p2*(botW-topW);
    const c1=tr.curve*(1-p1),c2=tr.curve*(1-p2);
    const stripe=((Math.floor((z1*12)+tr.scrollZ*2))%2===0);

    // Prato a fasce chiare/scure
    ctx.fillStyle=stripe?'#57c863':'#48b854';
    ctx.fillRect(0,Math.floor(y1),W,Math.ceil(y2-y1)+1);

    // Carreggiata chiara ad alto contrasto
    ctx.fillStyle=stripe?'#f1f5f9':'#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(W/2+c1-w1/2,y1);
    ctx.lineTo(W/2+c1+w1/2,y1);
    ctx.lineTo(W/2+c2+w2/2,y2);
    ctx.lineTo(W/2+c2-w2/2,y2);
    ctx.fill();

    // Cordoli laterali Arcobaleno Apple
    const curbCol=rbCols[(i+Math.floor(fN/6))%6];
    ctx.fillStyle=curbCol;
    ctx.fillRect(Math.round(W/2+c1-w1/2-5),Math.round(y1),5,Math.ceil(y2-y1)+1);
    ctx.fillRect(Math.round(W/2+c1+w1/2),Math.round(y1),5,Math.ceil(y2-y1)+1);

    // Linee divisorie tratteggiate blu scuro tra le 3 corsie
    if(stripe){
      ctx.fillStyle='#64748b';
      const l1=W/2+c1-w1/6,r1=W/2+c1+w1/6;
      ctx.fillRect(Math.round(l1)-1,Math.round(y1),2,Math.ceil(y2-y1));
      ctx.fillRect(Math.round(r1)-1,Math.round(y1),2,Math.ceil(y2-y1));
    }
  }

  // Disegno oggetti 3D dal più lontano al più vicino con etichette chiare
  const sorted=[...tr.objs].sort((a,b)=>b.z-a.z);
  for(const o of sorted){
    if(o.z<0||o.z>1)continue;
    const p=Math.pow(1-o.z,1.45);
    const sy=hzY+p*(playerY-hzY);
    const rw=topW+p*(botW-topW);
    const cxCenter=W/2+tr.curve*(1-p);
    const sc=0.26+p*0.92;

    if(o.t==='turn'){
      const bh=Math.max(10,Math.round(24*sc));
      ctx.fillStyle=o.done?'#22c55e':(fN%8<4?'#ffd84a':'#f97316');
      ctx.fillRect(Math.round(cxCenter-rw/2),Math.round(sy-bh),Math.round(rw),bh);
      ctx.strokeStyle='#142238';ctx.lineWidth=2;
      ctx.strokeRect(Math.round(cxCenter-rw/2),Math.round(sy-bh),Math.round(rw),bh);
      ctx.fillStyle='#142238';
      ctx.font=`bold ${Math.max(8,Math.round(12*sc))}px "Courier New",monospace`;
      ctx.textAlign='center';
      ctx.fillText(o.dir===-1?'<<< GIRA SX <<<':'>>> GIRA DX >>>',cxCenter,Math.round(sy-bh*0.72));
      continue;
    }

    const laneX=cxCenter+(o.lane-1)*(rw/3);
    const laneW=Math.max(10,Math.round((rw/3)*0.82));

    if(o.t==='coin'){
      const cw=Math.max(7,Math.round(17*sc));
      ctx.drawImage(S.rainbow,Math.round(laneX-cw/2),Math.round(sy-cw-3*sc),cw,cw);
    }else if(o.t==='low'){
      // Ostacolo Basso Giallo/Arancio -> SALTA ▲
      const oh=Math.max(7,Math.round(16*sc));
      const rx=Math.round(laneX-laneW/2),ry=Math.round(sy-oh);
      ctx.fillStyle='#facc15';
      ctx.fillRect(rx,ry,laneW,oh);
      ctx.fillStyle='#ea580c';
      ctx.fillRect(rx,ry,laneW,Math.max(2,Math.round(4*sc)));
      ctx.strokeStyle='#142238';ctx.lineWidth=1.5;
      ctx.strokeRect(rx,ry,laneW,oh);
      if(sc>0.55){
        ctx.fillStyle='#142238';
        ctx.font=`bold ${Math.max(7,Math.round(8*sc))}px "Courier New",monospace`;
        ctx.textAlign='center';
        ctx.fillText('▲',laneX,ry+2);
      }
    }else if(o.t==='high'){
      // Portale Alto Blu/Ciano -> SCIVOLA / GIÙ ▼
      const totalH=Math.max(16,Math.round(42*sc));
      const beamH=Math.max(7,Math.round(19*sc));
      const rx=Math.round(laneX-laneW/2),ry=Math.round(sy-totalH);
      ctx.fillStyle='#1e293b';
      ctx.fillRect(rx,ry,3,totalH);
      ctx.fillRect(rx+laneW-3,ry,3,totalH);
      ctx.fillStyle='#0284c7';
      ctx.fillRect(rx,ry,laneW,beamH);
      ctx.strokeStyle='#142238';ctx.lineWidth=1.5;
      ctx.strokeRect(rx,ry,laneW,beamH);
      if(sc>0.55){
        ctx.fillStyle='#ffffff';
        ctx.font=`bold ${Math.max(7,Math.round(8*sc))}px "Courier New",monospace`;
        ctx.textAlign='center';
        ctx.fillText('▼',laneX,ry+Math.round(beamH*0.2));
      }
    }else if(o.t==='wall'){
      // Muro Rosso -> CAMBIA CORSIA
      const oh=Math.max(14,Math.round(36*sc));
      const rx=Math.round(laneX-laneW/2),ry=Math.round(sy-oh);
      ctx.fillStyle='#e11d48';
      ctx.fillRect(rx,ry,laneW,oh);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(rx+3,ry+4,laneW-6,Math.max(2,Math.round(4*sc)));
      ctx.strokeStyle='#142238';ctx.lineWidth=1.5;
      ctx.strokeRect(rx,ry,laneW,oh);
    }
  }

  // Giocatore sulla corsia
  const px=W/2+tr.laneX*(botW/3);
  const jumpArc=tr.jumpT>0?Math.sin((1-tr.jumpT/tr.jumpMax)*Math.PI)*38:0;
  const isDuck=tr.duckT>0;
  const pw=isDuck?30:26;
  const ph=isDuck?14:26;

  ctx.fillStyle='rgba(20,34,56,0.32)';
  ctx.fillRect(Math.round(px-12),playerY-2,24,4);

  ctx.fillStyle=rbCols[Math.floor(fN/4)%6];
  ctx.fillRect(Math.round(px-pw/2-2),Math.round(playerY-ph-jumpArc-2),pw+4,ph+4);
  ctx.drawImage(pl2,Math.round(px-pw/2),Math.round(playerY-ph-jumpArc),pw,ph);

  // Popups punteggio
  ctx.textAlign='center';
  ctx.font='bold 9px "Courier New",monospace';
  for(const q of pops){
    ctx.fillStyle='#ffffff';ctx.fillText(q.t,Math.round(q.x)+1,Math.round(q.y)+1);
    ctx.fillStyle=q.c;ctx.fillText(q.t,Math.round(q.x),Math.round(q.y));
  }

  // Banner istruzioni nei primi secondi o avviso svolta
  const nearTurn=tr.objs.find(o=>o.t==='turn'&&!o.done&&o.z<0.55&&o.z>0);
  if(nearTurn){
    ctx.fillStyle='#ffffff';
    ctx.fillRect(W/2-96,hzY-26,192,18);
    ctx.strokeStyle='#142238';ctx.strokeRect(W/2-96,hzY-26,192,18);
    ctx.fillStyle='#d92638';
    ctx.font='bold 10px "Courier New",monospace';
    ctx.fillText(nearTurn.dir===-1?'<<< SWIPE O TOCCA SX! <<<':'>>> SWIPE O TOCCA DX! >>>',W/2,hzY-21);
  }else if(tr.introT>0){
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.fillRect(W/2-112,hzY+8,224,32);
    ctx.strokeStyle='#142238';ctx.strokeRect(W/2-112,hzY+8,224,32);
    ctx.fillStyle='#0b65c6';
    ctx.font='bold 9px "Courier New",monospace';
    ctx.fillText('SWIPE SULLO SCHERMO O USA I TASTI:',W/2,hzY+13);
    ctx.fillStyle='#142238';
    ctx.fillText('◀ ▶ CORSIA/CURVA · ▲ SALTA · ▼ GIÙ',W/2,hzY+25);
  }

  // HUD Chiaro Superiore
  ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.fillRect(6,6,168,38);
  ctx.strokeStyle='#142238';ctx.strokeRect(6,6,168,38);
  ctx.fillStyle='#963d97';
  ctx.font='bold 9px "Courier New",monospace';
  ctx.fillText('LIVELLO BONUS 3D',12,10);
  ctx.fillStyle='#0a7d42';
  ctx.fillText('PUNTI BONUS: +'+tr.pts,12,21);
  ctx.fillStyle='#142238';ctx.fillRect(12,33,154,5);
  ctx.fillStyle=rbCols[Math.floor(fN/6)%6];
  ctx.fillRect(13,34,Math.max(0,Math.round((tr.time/tr.maxTime)*152)),3);

  // Pulsantiera Touch in basso + supporto completo Swipe su tutto lo schermo
  const btnY=botY+4,btnH=H-botY-6,btnW=Math.floor((W-16)/5);
  const labels=['◀ SX','● CTR','▲ SU','▼ GIÙ','DX ▶'];
  ctx.textAlign='center';
  ctx.font='bold 8px "Courier New",monospace';
  for(let i=0;i<5;i++){
    const bx=4+i*(btnW+2);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(bx,btnY,btnW,btnH);
    ctx.strokeStyle='#142238';
    ctx.strokeRect(bx,btnY,btnW,btnH);
    ctx.fillStyle='#142238';
    ctx.fillText(labels[i],bx+btnW/2,btnY+Math.max(4,Math.floor((btnH-8)/2)));
  }
  ctx.textAlign='left';
}

// ---------- CONTROLLI E FISICA 2D ----------
function jump(){
  if(mode!=='play')return;
  if(p.j>=2){jbuf=9;return;}
  if(p.j===0){
    snd(350,.11,'square',.045,680);
    p.vy=-9.0;
  }else{
    snd(540,.13,'square',.05,1080);
    burst(p.x+12,p.y+22,'#0b65c6',7);
    p.vy=-8.2;
  }
  p.j++;
}

const hit=(a,b,m=2)=>a.x+m<b.x+b.w-m&&a.x+a.w-m>b.x+m&&a.y+m<b.y+b.h-m&&a.y+a.h-m>b.y+m;
function burst(x,y,c,n=10){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-2.8,2.8),vy:rnd(-3.8,1),l:rnd(18,34),c});}

function damage(){
  if(hurt>0||inv>0)return;
  hurt=85;lives--;lost++;combo=0;shake=14;
  snd(130,.28,'sawtooth',.07,55);
  burst(p.x+12,p.y+12,'#e62e3d',15);
  if(lives<=0)gameOver();
}

function isFreeX(x,minGap=26){
  for(const o of obs)if(Math.abs((o.x+o.w/2)-x)<minGap)return false;
  for(const i of items)if(Math.abs((i.x+i.w/2)-x)<minGap)return false;
  return true;
}

function spawnObstacle(){
  const r=Math.random();
  let o;
  if(r<0.42)o={s:S.win,v:1,air:0};
  else if(r<0.78)o={s:S.tux,v:1,air:0};
  else o={s:S.and,v:1.05,air:1};
  o.w=o.s.width;o.h=o.s.height;
  o.x=W+20;
  o.y=o.air?(GY-48):(GY-o.h);
  obs.push(o);

  if(lives<5&&Math.random()<0.14){
    const hx=W+95;
    if(isFreeX(hx,28)){
      items.push({t:'apple',s:S.apple,x:hx,y:GY-64,w:S.apple.width,h:S.apple.height});
    }
  }
}

function spawnCoins(){
  const lane=Math.random()<0.34?0:(Math.random()<0.52?1:2);
  const count=5;
  const baseX=W+25;
  for(let k=0;k<count;k++){
    const cx=baseX+k*18;
    const arc=Math.sin((k/(count-1))*Math.PI);
    let cyPos;
    if(lane===0)cyPos=GY-18;
    else if(lane===1)cyPos=GY-52-arc*22;
    else cyPos=GY-104-arc*24;
    if(isFreeX(cx,14)){
      items.push({t:'bit',s:S.bit,x:cx,y:cyPos,w:12,h:12});
    }
  }
}

function spawnTim(){
  const tx=W+40;
  const ty=GY-126;
  items.push({t:'tim',s:S.tim,x:tx,y:ty,w:S.tim.width,h:S.tim.height});
}

function update(dt){
  const L=LV[level-1];
  const levelSecs=(level===LV.length)?90:45;
  const maxLs=(L.boss&&!bossDone)?995:1000;
  ls=Math.min(maxLs,ls+(1000/(levelSecs*60))*dt);

  const prog=Math.min(1,ls/1000);
  const st=Math.min(Math.floor(ls/200),4);
  if(st>lastSt){
    lastSt=st;msg='VELOCITÀ UP!';msgT=65;
    snd(480,.14,'square',.045,920);
  }
  const baseV=1.85;
  const lvMult=1+((level-1)*0.18)+(prog*0.20);
  const targetSpeed=baseV*lvMult;
  speed+=(targetSpeed-speed)*Math.min(1,0.05*dt);

  const sp=speed*dt;
  const G=inv>0,ph=G?48:24;
  scroll+=sp;

  if(G){
    bgmTimer-=dt;
    if(bgmTimer<=0){
      bgmTimer=7.5;
      snd(SUPER_MELODY[melIdx%SUPER_MELODY.length],0.11,'square',0.04);
      melIdx++;
    }
  }

  p.vy+=0.55*dt;
  p.y+=p.vy*dt;
  if(p.y+ph>=GY){
    p.y=GY-ph;p.vy=0;p.j=0;
    if(wasAir){
      burst(p.x+ph/2,GY-2,'#8b9bb4',6);
      wasAir=false;
      if(jbuf>0){jbuf=0;jump();}
    }
  }else wasAir=true;

  if(hurt>0)hurt-=dt;
  if(inv>0){inv-=dt;if(inv<=0)superStreak=0;}
  if(msgT>0)msgT-=dt;
  if(tutT>0)tutT-=dt;
  if(shake>0)shake-=dt;
  if(jbuf>0)jbuf-=dt;

  if(L.boss&&!boss&&!bossDone&&ls>=666){
    boss={x:W+40,y:GY-42,w:42,h:42,st:'in',passes:0,t:0,shot:0};
    obs=[];items=[];
    msg='BOSS: '+L.boss.toUpperCase()+'!';msgT=120;
    arp([220,196,175,147],.15,90);
  }

  if(boss){
    if(boss.st==='in'){
      boss.x-=2.4*dt;
      if(boss.x<=W-58){boss.st='wait';boss.t=68;boss.shot=0;}
    }else if(boss.st==='wait'){
      boss.t-=dt;
      boss.y=GY-42-Math.abs(Math.sin(fN/9))*6;
      if(!boss.shot&&boss.t<34){
        boss.shot=1;
        const air=boss.passes%2===1;
        const s=air?S.and:S.tux;
        obs.push({s,v:1.35,x:boss.x-6,w:s.width,h:s.height,y:air?GY-46:GY-s.height,air});
        snd(240,.14,'sawtooth',.05,120);
      }
      if(boss.t<=0){boss.st='charge';boss.y=GY-42;}
    }else{
      boss.x-=(speed+3.2)*dt;
      if(boss.x<-boss.w){
        boss.passes++;
        if(boss.passes>=4){
          boss=null;bossDone=true;
          burst(W/2,GY-30,'#ffd84a',36);
          msg='BOSS SCONFITTO!';msgT=110;
          items.push({t:'apple',s:S.apple,x:W+12,y:GY-44,w:S.apple.width,h:S.apple.height});
          arp([392,523,659,784,1047],.14,85);
        }else{
          boss.st='in';boss.x=W+36;
        }
      }
    }
  }else if(!(L.boss&&ls>=666&&!bossDone)){
    nextSpawnDist-=sp;
    if(nextSpawnDist<=0){
      spawnObstacle();
      const densityFactor=Math.max(0.58,1-(level-1)*0.042);
      nextSpawnDist=rnd(125,195)*densityFactor+(level===1?35:0);
    }
    nextCoinDist-=sp;
    if(nextCoinDist<=0){
      spawnCoins();
      nextCoinDist=rnd(115,170);
    }
    nextTimDist-=sp;
    if(nextTimDist<=0){
      spawnTim();
      nextTimDist=rnd(220,310);
    }
  }

  if(!rbSpawned&&ls>=310&&!boss){
    rbSpawned=true;
    items.push({t:'rainbow',s:S.rainbow,x:W+24,y:GY-88,w:S.rainbow.width,h:S.rainbow.height});
    msg='MELA ARCOBALENO IN ARRIVO!';msgT=85;
  }

  if(!pu5&&ls>=540&&!boss){
    pu5=true;
    items.push({t:'steve',s:S.steve,x:W+16,y:GY-74,w:S.steve.width,h:S.steve.height});
  }

  const pb={x:p.x,y:p.y,w:ph,h:ph};
  for(const o of obs)o.x-=sp*(o.v||1);
  for(const i of items)i.x-=sp;

  for(const i of items){
    if(i.t==='bit'){
      const dx=(p.x+ph/2)-(i.x+6),dy=(p.y+ph/2)-(i.y+6),d=Math.hypot(dx,dy);
      if(d<42&&d>1){i.x+=(dx/d)*3.1*dt;i.y+=(dy/d)*3.1*dt;}
    }
  }

  for(const o of obs){
    if(hit(pb,o,2)){
      if(G){
        o.dead=1;
        superStreak++;
        const pts=superStreak*100;
        bonus+=pts;
        pops.push({x:o.x,y:o.y,t:'+'+pts,c:'#0b65c6',l:34});
        burst(o.x+o.w/2,o.y+o.h/2,'#ffd84a',14);
        snd(300+Math.min(superStreak,8)*80,.1,'square',.05,600);
      }else{
        o.dead=1;damage();
        if(mode!=='play')return;
      }
    }
  }

  for(const i of items){
    const margin=i.t==='bit'?-4:1;
    if(hit(pb,i,margin)){
      i.dead=1;
      if(i.t==='apple'){
        lives=Math.min(5,lives+1);
        pops.push({x:i.x,y:i.y,t:'VITA +1',c:'#e62e3d',l:32});
        snd(700,.18,'triangle',.06,1200);
      }else if(i.t==='bit'){
        bits++;bonus+=10;combo++;
        pops.push({x:i.x,y:i.y,t:'+10',c:'#d97706',l:28});
        snd(880+Math.min(combo,8)*55,.06,'square',.038);
        if(combo%5===0){
          bonus+=50;
          msg='COMBO x'+combo+'! +50';msgT=65;
          burst(p.x+12,p.y,'#ffd84a',10);
        }
      }else if(i.t==='tim'){
        timCount++;bonus+=250;
        burst(i.x+10,i.y+10,'#3b82f6',16);
        if(timCount%3===0){
          bonus+=1500;
          msg='3x TIM COOK! SUPER BONUS +1500!';msgT=110;
          pops.push({x:i.x,y:i.y,t:'+1500!',c:'#0a7d42',l:45});
          arp([523,659,784,1047,1318],.13,75);
        }else{
          msg='TIM COOK ('+(timCount%3)+'/3)! +250';msgT=80;
          pops.push({x:i.x,y:i.y,t:'+250',c:'#1d4ed8',l:36});
          arp([587,784,987],.1,70);
        }
      }else if(i.t==='steve'){
        inv=invMax;superStreak=0;bgmTimer=0;
        msg='STEVE SUPER MODE!';msgT=95;
        arp([523,659,784,1047],.12,70);
      }else if(i.t==='rainbow'){
        startTempleBonus();
        return;
      }
    }
  }

  if(boss&&boss.st!=='in'&&hit(pb,boss,5)&&hurt<=0){
    damage();if(mode!=='play')return;
  }

  obs=obs.filter(o=>!o.dead&&o.x+o.w>-16);
  items=items.filter(i=>!i.dead&&i.x+i.w>-16);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=0.18*dt;q.l-=dt;}
  parts=parts.filter(q=>q.l>0);
  for(const q of pops){q.y-=0.55*dt;q.l-=dt;}
  pops=pops.filter(q=>q.l>0);

  if(ls>=1000&&!boss)startQuizCountdown();
}

// ---------- DISEGNO 2D ----------
function draw(){
  if(mode==='temple'){
    drawTemple();
    return;
  }
  fN++;
  ctx.save();
  if(shake>0)ctx.translate(Math.round(rnd(-2.5,2.5)),Math.round(rnd(-2.5,2.5)));

  ctx.drawImage(bg.sky,0,0);
  const ox=-Math.floor((scroll*0.25)%W);
  ctx.drawImage(bg.far,ox,0);
  ctx.drawImage(bg.far,ox+W,0);
  for(let x=-Math.floor(scroll%24);x<W;x+=24)ctx.drawImage(bg.tile,x,GY);

  for(const i of items){
    const bob=Math.sin((fN+i.x)/8)*2;
    if(i.t==='tim'){
      if(fN%10<5){
        ctx.fillStyle='rgba(29,78,216,0.22)';
        ctx.fillRect(Math.round(i.x)-2,Math.round(i.y+bob)-2,i.w+4,i.h+4);
      }
      ctx.font='bold 7px "Courier New",monospace';
      ctx.fillStyle='#0b65c6';
      ctx.fillText('2x',Math.round(i.x)+6,Math.round(i.y+bob)-8);
    }else if(i.t==='rainbow'){
      const rb=['#61bb46','#fdb827','#f5821f','#e03a3e','#963d97','#009ddc'][Math.floor(fN/4)%6];
      ctx.fillStyle=rb;
      ctx.fillRect(Math.round(i.x)-3,Math.round(i.y+bob)-3,i.w+6,i.h+6);
      ctx.font='bold 7px "Courier New",monospace';
      ctx.fillStyle='#963d97';
      ctx.fillText('3D!',Math.round(i.x)+4,Math.round(i.y+bob)-9);
    }
    ctx.drawImage(i.s,Math.round(i.x),Math.round(i.y+bob));
  }

  for(const o of obs)ctx.drawImage(o.s,Math.round(o.x),Math.round(o.y));

  if(boss&&bossS){
    ctx.drawImage(bossS,Math.round(boss.x),Math.round(boss.y));
    if(boss.st==='wait'&&boss.t<42&&fN%8<5){
      ctx.fillStyle='#e62e3d';
      ctx.fillRect(Math.round(boss.x)+18,Math.round(boss.y)-16,5,9);
      ctx.fillRect(Math.round(boss.x)+18,Math.round(boss.y)-5,5,4);
    }
  }

  const G=inv>0,s=G?pl4:pl2,ph0=G?48:24;
  const sw=Math.max(8,ph0-(GY-(p.y+ph0))/4);
  ctx.fillStyle='rgba(20,34,56,0.28)';
  ctx.fillRect(Math.round(p.x+(ph0-sw)/2),GY-1,Math.round(sw),3);

  if(!(hurt>0&&fN%6<3)){
    if(G&&fN%8<4){
      ctx.fillStyle='rgba(255,216,74,0.55)';
      ctx.fillRect(p.x-3,Math.round(p.y)-3,s.width+6,s.height+6);
    }
    ctx.drawImage(s,p.x,Math.round(p.y));
  }

  if(mode==='play'||mode==='countdown'){
    cy+=(p.y-4-cy)*0.14;
    ctx.drawImage(S.pixi,Math.max(4,p.x-20),Math.round(cy+Math.sin(fN/9)*2));
    for(let i=0;i<2;i++){
      ctx.fillStyle=i<(2-p.j)?'#16a34a':'#94a3b8';
      ctx.fillRect(Math.round(p.x+ph0/2-6+i*7),Math.round(p.y)-7,5,3);
      ctx.strokeStyle='#142238';ctx.lineWidth=1;
      ctx.strokeRect(Math.round(p.x+ph0/2-6+i*7),Math.round(p.y)-7,5,3);
    }
  }

  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2);}
  ctx.font='bold 9px "Courier New",monospace';
  for(const q of pops){
    ctx.fillStyle='#ffffff';ctx.fillText(q.t,Math.round(q.x)+1,Math.round(q.y)+1);
    ctx.fillStyle=q.c||'#d97706';ctx.fillText(q.t,Math.round(q.x),Math.round(q.y));
  }

  const L=LV[level-1];
  const spdPct=Math.round((speed/1.85)*100);
  ctx.textBaseline='top';
  ctx.font='bold 9px "Courier New",monospace';

  ctx.fillStyle='rgba(255,255,255,0.82)';
  ctx.fillRect(4,4,154,54);
  ctx.strokeStyle='#142238';ctx.lineWidth=1;
  ctx.strokeRect(4,4,154,54);

  ctx.fillStyle='#142238';
  ctx.fillText('PUNTI '+String(score()).padStart(5,'0'),8,7);
  ctx.fillStyle='#0b65c6';
  ctx.fillText('LV'+level+' · VEL '+spdPct+'%',8,18);
  ctx.fillStyle='#b45309';
  ctx.fillText(L.n.toUpperCase(),8,29);

  ctx.fillStyle='#142238';ctx.fillRect(8,41,104,5);
  ctx.fillStyle='#22c55e';ctx.fillRect(9,42,Math.min(102,Math.round(ls*0.102)),3);

  ctx.fillStyle='#142238';ctx.fillRect(8,49,104,5);
  if(inv>0){
    ctx.fillStyle=fN%6<3?'#ffd84a':'#38bdf8';
    ctx.fillRect(9,50,Math.max(0,Math.round((inv/invMax)*102)),3);
    ctx.fillStyle='#d92638';
    ctx.fillText('SUPER',115,47);
  }else{
    ctx.fillStyle='#cbd5e1';ctx.fillRect(9,50,102,3);
  }

  const rightMargin=isPortrait?6:58;
  const topOffset=isPortrait?28:6;
  const panelW=78,panelH=38;
  const panelX=W-rightMargin-panelW;

  ctx.fillStyle='rgba(255,255,255,0.82)';
  ctx.fillRect(panelX,topOffset-2,panelW,panelH);
  ctx.strokeStyle='#142238';
  ctx.strokeRect(panelX,topOffset-2,panelW,panelH);

  for(let i=0;i<lives;i++){
    ctx.drawImage(S.appleHud,W-rightMargin-4-(i+1)*14,topOffset);
  }
  ctx.textAlign='right';
  ctx.fillStyle='#b45309';
  ctx.fillText('BIT x'+String(bits).padStart(3,'0'),W-rightMargin-4,topOffset+14);

  ctx.drawImage(S.timHud,W-rightMargin-58,topOffset+23);
  ctx.fillStyle='#1d4ed8';
  ctx.fillText('TIM '+(timCount%3)+'/3',W-rightMargin-4,topOffset+25);

  ctx.textAlign='center';
  const tx=(t,y,c)=>{
    ctx.fillStyle='#ffffff';ctx.fillText(t,W/2+1,y+1);
    ctx.fillStyle=c;ctx.fillText(t,W/2,y);
  };
  if(msgT>0)tx(msg,Math.max(70,GY-105),'#d92638');
  if(tutT>0&&mode==='play'&&fN%40<32){
    const ty=Math.max(76,GY-92);
    tx('TOCCA = SALTA · 2 TOCCHI = DOPPIO SALTO',ty,'#142238');
    tx('MELA ARCOBALENO = LIVELLO BONUS 3D!',ty+12,'#963d97');
    tx('PRENDI LE MELE (VITE) E 3 TIM COOK!',ty+24,'#0a7d42');
  }
  ctx.textAlign='left';
  ctx.restore();
}

// ---------- SCHERMATE E QUIZ ----------
function show(html){ov.innerHTML='<div class="panel">'+html+'</div>';ov.style.display='flex';}

function menu(){
  mode='menu';pauseBtn.style.display='none';
  show(`<h1>APPLE TECH RUNNER</h1>
  <p>Corri con i 10 dispositivi iconici insieme a Pixi!</p>
  <p>1 tocco = salta &middot; 2 tocchi = doppio salto</p>
  <p>Prendi il <b>Logo Apple Arcobaleno</b> per il <b>Bonus 3D (con Swipe su telefono o Frecce su PC)</b> e <b>3 Tim Cook</b> (+1500 pt)!</p>
  <button data-a="start">GIOCA ORA</button>
  <button data-a="mute">SUONO: ${muted?'OFF':'ON'}</button><br>
  <input id="pw" maxlength="12" placeholder="CODICE LIVELLO" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
  <button data-a="pw">VAI AL LIVELLO</button>
  <p class="err" id="er"></p>`);
}

function startQuizCountdown(){
  mode='countdown';pauseBtn.style.display='none';
  cdTimer=3;
  const L=LV[level-1];
  const renderCd=()=>{
    show(`<h1>PREPARATI AL QUIZ!</h1>
    <p>Livello ${level}: ${L.n} (${L.cat})</p>
    <div class="cnt">${cdTimer}</div>
    <p>La domanda apparirà tra un istante...</p>`);
  };
  renderCd();
  snd(523,.12,'square',.05);
  const iv=setInterval(()=>{
    if(mode!=='countdown'){clearInterval(iv);return;}
    cdTimer--;
    if(cdTimer>0){
      snd(523,.12,'square',.05);
      renderCd();
    }else{
      clearInterval(iv);
      snd(784,.18,'square',.06);
      showQuiz();
    }
  },850);
}

function showQuiz(){
  mode='quiz';
  const L=LV[level-1];
  qopts=L.o.map((t,i)=>({t,ok:i===0})).sort(()=>Math.random()-0.5);
  qLockUntil=performance.now()+550;
  show(`<h1>QUIZ LIVELLO ${level}</h1>
  <p>${L.n} &middot; ${L.cat}</p>
  <p>${L.q}</p>`+
  qopts.map((o,i)=>`<button class="opt qbtn" disabled data-a="q" data-v="${i}">${'ABC'[i]}) ${o.t}</button>`).join(''));
  setTimeout(()=>{
    document.querySelectorAll('.qbtn').forEach(b=>b.disabled=false);
  },550);
}

function levelClear(){
  bank+=1000;ls=0;
  if(level>=LV.length){
    mode='over';pauseBtn.style.display='none';
    show(`<h1>HAI COMPLETATO IL GIOCO!</h1>
    <p>Hai superato tutti i ${LV.length} livelli della storia Apple!</p>
    <p>PUNTEGGIO FINALE: ${score()}</p>${stats()}
    <button data-a="share">CONDIVIDI SU INSTAGRAM</button>
    <button data-a="again">RIGIOCA</button>
    <button data-a="menu">MENU</button><p id="sn"></p>`);
    return;
  }
  mode='clear';pauseBtn.style.display='none';
  show(`<h1>LIVELLO ${level} SUPERATO!</h1>
  <p>Codice per sbloccare il Livello ${level+1} (${LV[level].n}):</p>
  <div class="code">${pw(level+1)}</div>
  <p>Segnalo per ripartire da qui quando vuoi!</p>
  <button data-a="next">PROSSIMO LIVELLO</button>`);
}

function gameOver(){
  mode='over';pauseBtn.style.display='none';
  show(`<h1>GAME OVER</h1>
  <p>PUNTEGGIO: ${score()} &middot; LIVELLO ${level} (${LV[level-1].n})</p>${stats()}`+
  (level>1?`<p>Codice di accesso per questo livello:</p><div class="code">${pw(level)}</div>`:'')+
  `<br><button data-a="share">CONDIVIDI SU INSTAGRAM</button>
  <button data-a="again">RIPROVA</button>
  <button data-a="menu">MENU</button><p id="sn"></p>`);
}

async function share(){
  const t=`Ho totalizzato ${score()} punti ad APPLE TECH RUNNER 8-BIT arrivando al livello ${level} (${LV[level-1].n}) con ${bits} bit e ${timCount} Tim Cook raccolti! 🍎👾 Riesci a battermi?`;
  const sn=document.getElementById('sn');
  try{if(navigator.share){await navigator.share({title:'Apple Tech Runner',text:t});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(t);if(sn)sn.textContent='Testo copiato! Incollalo nelle Storie o nei DM di Instagram.';}
  catch(e){window.prompt('Copia questo testo per Instagram:',t);}
}

let prevMode='play';
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='q'&&performance.now()<qLockUntil)return;
  snd(620,.05,'square',.035);
  if(a==='mute'){muted=!muted;b.textContent='SUONO: '+(muted?'OFF':'ON');}
  else if(a==='start')startGame(1);
  else if(a==='pw'){
    const c=(document.getElementById('pw').value||'').trim().toUpperCase();
    let f=0;for(let l=2;l<=LV.length;l++)if(pw(l)===c)f=l;
    if(f)startGame(f);else document.getElementById('er').textContent='Codice non valido!';
  }
  else if(a==='q'){
    if(qopts[v].ok){
      arp([523,659,784,1047],.12,85);
      levelClear();
    }else{
      snd(150,.35,'sawtooth',.07,65);
      lives--;lost++;
      if(lives<=0)return gameOver();
      show(`<h1 class="err">RISPOSTA ERRATA!</h1>
      <p>Risposta esatta: <b>${LV[level-1].o[0]}</b></p>
      <p>Perdi una mela (vite rimaste: ${lives}). Riprendi l'ultimo tratto!</p>
      <button data-a="resume">CONTINUA</button>`);
    }
  }
  else if(a==='unpause'){mode=prevMode;ov.style.display='none';pauseBtn.style.display='block';}
  else if(a==='resume'){ls=880;obs=[];items=[];hurt=65;mode='play';ov.style.display='none';pauseBtn.style.display='block';}
  else if(a==='next'){level++;startLevel();}
  else if(a==='again')startGame(1);
  else if(a==='menu')menu();
  else if(a==='share')share();
});

function pauseGame(){
  if(mode!=='play'&&mode!=='temple')return;
  prevMode=mode;
  mode='pause';pauseBtn.style.display='none';
  show(`<h1>GIOCO IN PAUSA</h1>
  <p>Livello ${level}: ${LV[level-1].n}</p>
  <button data-a="unpause">RIPRENDI</button>
  <button data-a="mute">SUONO: ${muted?'OFF':'ON'}</button>
  <button data-a="menu">TORNA AL MENU</button>`);
}

pauseBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();pauseGame();});

// ---------- GESTIONE SWIPE TOUCH + TAP PER SMARTPHONE E PC ----------
let touchStart=null;

function onStartTouch(clientX,clientY,target){
  if(target&&target.closest&&(target.closest('#pauseBtn')||target.closest('#ov')))return;
  if(mode==='play'){
    jump();
  }else if(mode==='temple'){
    const rect=cv.getBoundingClientRect();
    const cx=(clientX-rect.left)*(W/Math.max(1,rect.width));
    const cyPos=(clientY-rect.top)*(H/Math.max(1,rect.height));
    const botY=isPortrait?Math.round(H*0.82):Math.round(H*0.84);
    if(cyPos>=botY){
      const idx=Math.min(4,Math.max(0,Math.floor((cx-4)/((W-8)/5))));
      templeAction(['left','center','up','down','right'][idx]);
      touchStart=null;
      return;
    }
    touchStart={x:clientX,y:clientY,cx,cyPos,done:false};
  }
}

function onMoveTouch(clientX,clientY){
  if(mode!=='temple'||!touchStart||touchStart.done)return;
  const dx=clientX-touchStart.x,dy=clientY-touchStart.y;
  // Soglia di 12px per rendere lo swipe su smartphone immediato e reattivo
  if(Math.hypot(dx,dy)>12){
    touchStart.done=true;
    if(Math.abs(dx)>Math.abs(dy))templeAction(dx<0?'left':'right');
    else templeAction(dy<0?'up':'down');
  }
}

function onEndTouch(){
  // Se l'utente fa un tap rapido (senza swipe) nella parte sinistra o destra dello schermo nel livello 3D,
  // sposta subito il personaggio a sinistra o destra (comodissimo su telefono!)
  if(mode==='temple'&&touchStart&&!touchStart.done){
    if(touchStart.cx<W*0.36)templeAction('left');
    else if(touchStart.cx>W*0.64)templeAction('right');
    else templeAction('up');
  }
  touchStart=null;
}

// Eventi Touch nativi per iOS / Android + Pointer fallback per Desktop
window.addEventListener('touchstart',e=>{
  if(e.target.closest('#pauseBtn')||e.target.closest('#ov'))return;
  if(mode==='play'||mode==='temple')e.preventDefault();
  const t=e.changedTouches[0];
  if(t)onStartTouch(t.clientX,t.clientY,e.target);
},{passive:false});

window.addEventListener('touchmove',e=>{
  if(mode==='temple'&&touchStart){
    e.preventDefault();
    const t=e.changedTouches[0];
    if(t)onMoveTouch(t.clientX,t.clientY);
  }
},{passive:false});

window.addEventListener('touchend',()=>{onEndTouch();},{passive:false});

window.addEventListener('mousedown',e=>{
  if('ontouchstart' in window)return;
  onStartTouch(e.clientX,e.clientY,e.target);
});
window.addEventListener('mousemove',e=>{
  if('ontouchstart' in window)return;
  onMoveTouch(e.clientX,e.clientY);
});
window.addEventListener('mouseup',()=>{
  if('ontouchstart' in window)return;
  onEndTouch();
});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&(mode==='play'||mode==='temple'))pauseGame();});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='KeyP'){
    if(mode==='play'||mode==='temple')pauseGame();
    else if(mode==='pause'){mode=prevMode;ov.style.display='none';pauseBtn.style.display='block';}
  }
  if(e.code==='KeyM')muted=!muted;
  if(mode==='play'&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')){
    e.preventDefault();jump();
  }else if(mode==='temple'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){e.preventDefault();templeAction('left');}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){e.preventDefault();templeAction('right');}
    else if(e.code==='KeyC'){e.preventDefault();templeAction('center');}
    else if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){e.preventDefault();templeAction('up');}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();templeAction('down');}
  }
});

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/16.667,3)||1;last=t;
  if(mode==='play')update(dt);
  else if(mode==='temple')updateTemple(dt);
  else if(mode==='menu'||mode==='over')scroll+=0.55*dt;
  draw();
}

resize();setupSprites();menu();requestAnimationFrame(frame);
})();
</script>
</body>
